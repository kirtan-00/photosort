<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>photosort</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header>
  <h1>photosort</h1>
  <nav>
    <button data-view="search" class="on">Search</button>
    <button data-view="people">People</button>
    <button data-view="categories">Categories</button>
    <button data-view="index">Index</button>
  </nav>
  <span id="stats" class="mono"></span>
  <div id="folderbar">
    <span id="folder-name" class="mono" title=""></span>
    <button type="button" id="open-folder">Open folder</button>
    <select id="recent-folders" class="mono"><option value="">recent&hellip;</option></select>
  </div>
  <div id="exportbar">
    <span id="export-dest" class="mono"></span>
    <button type="button" id="export-dest-change">Change destination</button>
    <button type="button" id="export-dest-reset" hidden>Reset</button>
  </div>
</header>

<main>
  <section id="view-nofolder" hidden>
    <div class="prompt">
      <p>No folder open.</p>
      <button type="button" id="open-folder-main">Open folder</button>
    </div>
  </section>

  <section id="view-search">
    <form id="q">
      <input name="q" placeholder="balcony, dining table, couple laughing..." autofocus autocomplete="off">
      <label>Sharp <input type="range" name="sharp" min="0" max="90" step="5" value="0"><output for="sharp" id="sharp-out">0</output>%</label>
      <select name="faces">
        <option value="">any faces</option>
        <option value="none">no people</option>
        <option value="one">one person</option>
        <option value="two">two</option>
        <option value="group">group (3+)</option>
      </select>
      <select name="person" id="person-select"><option value="">anyone</option></select>
      <input type="hidden" name="category" id="category-filter" value="">
      <button type="submit">Find</button>
      <button type="button" id="selectall-top" hidden>Select all shown</button>
      <span id="category-chip" class="chip mono" hidden>category: <span id="category-chip-name"></span> <button type="button" id="category-chip-clear">x</button></span>
    </form>
    <div id="grid" class="grid"></div>
    <div id="more-row" class="row" hidden>
      <span id="shown-count" class="mono"></span>
      <button type="button" id="show-more">Show more</button>
      <button type="button" id="select-matching">Select all matching</button>
    </div>
    <footer id="selbar" hidden>
      <span id="selcount" class="mono"></span>
      <button id="selectall">Select all shown</button>
      <input id="exportname" placeholder="folder name">
      <select id="exportmode">
        <option value="copy">copy</option>
        <option value="symlink">links (need the disk plugged in to open)</option>
        <option value="csv">csv</option>
      </select>
      <button id="export">Export</button>
      <button id="clearsel">Clear</button>
    </footer>
  </section>

  <section id="view-people" hidden>
    <div class="row">
      <button id="cluster">Group faces</button>
      <label>eps <input id="eps" type="number" step="0.05" value="0.5" class="mono"></label>
      <button id="export-people">Export people / groups / solo (links)</button>
      <button type="button" id="find-person">Find a person from a photo</button>
      <label>match <input id="find-sim" type="range" min="0.4" max="0.8" step="0.01" value="0.55"><output id="find-sim-out">0.55</output></label>
    </div>
    <div id="people" class="grid people"></div>
  </section>

  <section id="view-categories" hidden>
    <div class="row">
      <button type="button" id="categorise">Categorise</button>
      <span id="cat-progress" class="mono"></span>
    </div>
    <div id="cat-tiles" class="row"></div>
    <div id="cat-export-row" class="row" hidden>
      <label><input type="checkbox" id="cat-include-raw"> include RAW files</label>
      <select id="cat-export-mode">
        <option value="copy">copy</option>
        <option value="symlink">links (need the disk plugged in to open)</option>
      </select>
      <button type="button" id="cat-export-all">Export ticked categories</button>
    </div>
  </section>

  <section id="view-index" hidden>
    <div class="row">
      <label><input type="checkbox" id="faces" checked> detect faces</label>
      <label><input type="checkbox" id="retry-errors"> retry files that failed last time</label>
      <button id="start-index">Index this folder</button>
    </div>
    <pre id="progress" class="mono"></pre>
    <div id="index-errors" hidden>
      <p class="mono" id="index-errors-title"></p>
      <pre id="index-errors-list" class="mono"></pre>
    </div>
  </section>
</main>

<p id="status" class="mono status" aria-live="polite"></p>

<div id="lightbox" hidden>
  <div id="lb-frame">
    <img id="lb-img" alt="">
    <div id="lb-meta" class="mono"></div>
    <div class="lb-actions">
      <button id="lb-like">More like this</button>
      <button id="lb-close">Close</button>
    </div>
  </div>
</div>

<script src="/ui/app.js"></script>
</body>
</html>
